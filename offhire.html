<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Off Hire - Bulk Input</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #f5f7fa;
        }

        .main-container {
            max-width: 900px;
            margin: 40px auto;
        }

        .card {
            border: 0;
            border-radius: 16px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
        }

        .page-logo {
            width: 160px;
            max-width: 70%;
            height: auto;
            object-fit: contain;
        }

        .header-title {
            font-weight: 700;
            color: #0b3158;
        }

        .input-label {
            font-weight: 600;
            color: #0b3158;
        }

        .offhire-textarea {
            min-height: 280px;
            resize: vertical;
            text-transform: uppercase;
            font-family: Consolas, Monaco, monospace;
            font-size: 15px;
            line-height: 1.7;
        }

        .example-box {
            background: #f8f9fa;
            border-left: 4px solid #ff6b00;
            border-radius: 6px;
            padding: 12px 15px;
        }

        .example-data {
            font-family: Consolas, Monaco, monospace;
            margin-bottom: 0;
            white-space: pre-line;
        }

        .btn-submit {
            background: #0b3158;
            border-color: #0b3158;
        }

        .btn-submit:hover {
            background: #092744;
            border-color: #092744;
        }

        @media (max-width: 768px) {

            .main-container {
                margin: 15px auto;
            }

            .card-body {
                padding: 18px !important;
            }

            .page-logo {
                width: 130px;
            }

            .offhire-textarea {
                min-height: 250px;
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

<div class="container main-container">

    <div class="card">

        <div class="card-body p-md-4">

            <!-- Logo -->
            <div class="text-center mb-4">

                <img src="./img/logo.png"
                     alt="Logo"
                     class="page-logo mb-3">

                <h3 class="header-title mb-1">
                    Off Hire & Don't Accept
                </h3>

                <!-- <div class="text-muted">
                    Please enter container information.
                </div> -->

            </div>


            <form id="offHireForm">

                <div class="mb-3">

                    <label for="offHireData"
                           class="form-label input-label">
                        Please enter container information.
                    </label>

                    <textarea id="offHireData"
                              class="form-control offhire-textarea"
                              placeholder="COAU1234567,40HC,COS&#10;COAU7894561,20DC,COS"
                              required></textarea>

                </div>


                <!-- Example -->
                <div class="example-box mb-4">

                    <div class="fw-bold mb-1">
                        Example
                    </div>

                    <div class="text-muted small mb-2">
                        Format: Container No., Type ISO, Line
                    </div>

                    <div class="example-data">COAU1234567,40HC,COS
COAU7894561,20DC,COS</div>

                </div>


                <div id="validationMessage"
                     class="alert alert-danger d-none">
                </div>


                <div class="d-grid">

                    <button type="submit"
                            class="btn btn-primary btn-submit btn-lg">

                        Submit

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>


<script>

    // Auto Uppercase
    document.getElementById("offHireData")
        .addEventListener("input", function () {

            this.value = this.value.toUpperCase();

        });


    document.getElementById("offHireForm")
        .addEventListener("submit", function (event) {

            event.preventDefault();

            const text =
                document.getElementById("offHireData")
                    .value
                    .trim();

            const validationMessage =
                document.getElementById("validationMessage");

            validationMessage.classList.add("d-none");
            validationMessage.innerHTML = "";


            if (!text) {

                showError("Please enter container information.");

                return;
            }


            // แยกข้อมูลตามบรรทัด
            const lines = text
                .split(/\r?\n/)
                .map(x => x.trim())
                .filter(x => x !== "");


            const data = [];
            const errors = [];


            lines.forEach((line, index) => {

                const columns = line
                    .split(",")
                    .map(x => x.trim().toUpperCase());


                // ต้องมี 3 Column
                if (columns.length !== 3) {

                    errors.push(
                        `Line ${index + 1}: Invalid format.`
                    );

                    return;
                }


                const containerNo = columns[0];
                const typeIso = columns[1];
                const lineCode = columns[2];


                // Container = 4 Letters + 7 Numbers
                const containerRegex =
                    /^[A-Z]{4}[0-9]{7}$/;


                if (!containerRegex.test(containerNo)) {

                    errors.push(
                        `Line ${index + 1}: Invalid Container No. (${containerNo})`
                    );

                }


                if (typeIso.length !== 4) {

                    errors.push(
                        `Line ${index + 1}: Type ISO must contain 4 characters.`
                    );

                }


                if (lineCode.length !== 3) {

                    errors.push(
                        `Line ${index + 1}: Line must contain 3 characters.`
                    );

                }


                data.push({
                    containerNo: containerNo,
                    typeIso: typeIso,
                    line: lineCode
                });

            });


            // มี Validation Error
            if (errors.length > 0) {

                showError(errors.join("<br>"));

                return;
            }


            console.log("Off Hire Data:", data);


            /*
            ======================================
            ตัวอย่างข้อมูลที่พร้อมส่งเข้า .NET API
            ======================================

            [
                {
                    containerNo: "COAU1234567",
                    typeIso: "40HC",
                    line: "COS"
                },
                {
                    containerNo: "COAU7894561",
                    typeIso: "20DC",
                    line: "COS"
                }
            ]

            ตัวอย่างเรียก API:

            fetch("/api/offhire/save", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(data)

            })
            .then(response => response.json())
            .then(result => {

                alert(
                    "Please wait while the system updates."
                );

            });
            */


            alert(
                "Please wait while the system updates."
            );

        });


    function showError(message) {

        const validationMessage =
            document.getElementById("validationMessage");

        validationMessage.innerHTML = message;

        validationMessage.classList.remove("d-none");

    }

</script>

</body>
</html>
