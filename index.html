```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Off Hire</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #f5f7fa;
        }

        .main-container {
            max-width: 900px;
            margin: 40px auto;
        }

        .card {
            border: 0;
            border-radius: 16px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
        }

        .header-title {
            font-weight: 700;
            color: #0b3158;
        }

        .table th {
            background: #0b3158;
            color: white;
            white-space: nowrap;
        }

        .form-control {
            text-transform: uppercase;
        }

        .btn-add {
            background: #ff6b00;
            border-color: #ff6b00;
            color: white;
        }

        .btn-add:hover {
            background: #e65f00;
            border-color: #e65f00;
            color: white;
        }

        .btn-submit {
            background: #0b3158;
            border-color: #0b3158;
        }

        .row-number {
            width: 55px;
            text-align: center;
        }

        .action-column {
            width: 70px;
            text-align: center;
        }

        @media (max-width: 768px) {
            .main-container {
                margin: 15px auto;
            }

            .card-body {
                padding: 15px;
            }

            .table {
                min-width: 700px;
            }
        }
    </style>
</head>

<body>

<div class="container main-container">

    <div class="card">

        <div class="card-body p-md-4">

            <div class="d-flex justify-content-between align-items-center mb-4">

                <div>
                    <h3 class="header-title mb-1">
                        Off Hire
                    </h3>

                    <small class="text-muted">
                        Please enter container information.
                    </small>
                </div>

                <button type="button"
                        class="btn btn-add"
                        onclick="addRow()">
                    + Add Row
                </button>

            </div>

            <form id="offHireForm">

                <div class="table-responsive">

                    <table class="table table-bordered align-middle">

                        <thead>

                        <tr>
                            <th class="row-number">#</th>
                            <th>Container No.</th>
                            <th>Type ISO</th>
                            <th>Line</th>
                            <th class="action-column"></th>
                        </tr>

                        </thead>

                        <tbody id="containerRows">

                        <tr>

                            <td class="row-number">
                                1
                            </td>

                            <td>
                                <input type="text"
                                       class="form-control container-no"
                                       maxlength="11"
                                       placeholder="COAU1234567"
                                       required>
                            </td>

                            <td>
                                <input type="text"
                                       class="form-control type-iso"
                                       maxlength="4"
                                       placeholder="40HC"
                                       required>
                            </td>

                            <td>
                                <input type="text"
                                       class="form-control line"
                                       maxlength="3"
                                       placeholder="COS"
                                       required>
                            </td>

                            <td class="action-column">

                                <button type="button"
                                        class="btn btn-outline-danger btn-sm"
                                        onclick="removeRow(this)">
                                    ×
                                </button>

                            </td>

                        </tr>

                        </tbody>

                    </table>

                </div>

                <div class="d-grid mt-4">

                    <button type="submit"
                            class="btn btn-primary btn-submit btn-lg">

                        Submit

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>


<script>

    function addRow() {

        const tbody = document.getElementById("containerRows");

        const row = document.createElement("tr");

        row.innerHTML = `

            <td class="row-number"></td>

            <td>
                <input type="text"
                       class="form-control container-no"
                       maxlength="11"
                       placeholder="COAU1234567"
                       required>
            </td>

            <td>
                <input type="text"
                       class="form-control type-iso"
                       maxlength="4"
                       placeholder="40HC"
                       required>
            </td>

            <td>
                <input type="text"
                       class="form-control line"
                       maxlength="3"
                       placeholder="COS"
                       required>
            </td>

            <td class="action-column">

                <button type="button"
                        class="btn btn-outline-danger btn-sm"
                        onclick="removeRow(this)">
                    ×
                </button>

            </td>
        `;

        tbody.appendChild(row);

        updateRowNumber();
    }


    function removeRow(button) {

        const tbody = document.getElementById("containerRows");

        // ต้องเหลืออย่างน้อย 1 แถว
        if (tbody.rows.length <= 1) {

            alert("At least one row is required.");

            return;
        }

        button.closest("tr").remove();

        updateRowNumber();
    }


    function updateRowNumber() {

        const rows =
            document.querySelectorAll("#containerRows tr");

        rows.forEach((row, index) => {

            row.querySelector(".row-number").innerText =
                index + 1;

        });
    }


    // เปลี่ยนค่าที่กรอกเป็น Uppercase
    document.addEventListener("input", function (event) {

        if (event.target.matches(
            ".container-no, .type-iso, .line")) {

            event.target.value =
                event.target.value.toUpperCase();

        }

    });


    document.getElementById("offHireForm")
        .addEventListener("submit", function (event) {

            event.preventDefault();

            const rows =
                document.querySelectorAll("#containerRows tr");

            const data = [];

            let isValid = true;

            rows.forEach(row => {

                const containerNo =
                    row.querySelector(".container-no")
                       .value.trim()
                       .toUpperCase();

                const typeIso =
                    row.querySelector(".type-iso")
                       .value.trim()
                       .toUpperCase();

                const line =
                    row.querySelector(".line")
                       .value.trim()
                       .toUpperCase();


                // Container = 4 ตัวอักษร + 7 ตัวเลข
                const containerRegex =
                    /^[A-Z]{4}[0-9]{7}$/;

                if (!containerRegex.test(containerNo)) {

                    alert(
                        "Invalid Container No.: " +
                        containerNo
                    );

                    isValid = false;

                    return;
                }


                // Type ISO = 4 ตัว
                if (typeIso.length !== 4) {

                    alert(
                        "Type ISO must contain 4 characters."
                    );

                    isValid = false;

                    return;
                }


                // Line = 3 ตัว
                if (line.length !== 3) {

                    alert(
                        "Line must contain 3 characters."
                    );

                    isValid = false;

                    return;
                }


                data.push({

                    containerNo: containerNo,
                    typeIso: typeIso,
                    line: line

                });

            });


            if (!isValid)
                return;


            console.log("Off Hire Data:", data);


            /*
             * ===========================
             * CALL API HERE
             * ===========================
             *
             * ตัวอย่าง:
             *
             * fetch("/api/offhire/save", {
             *
             *     method: "POST",
             *
             *     headers: {
             *         "Content-Type": "application/json"
             *     },
             *
             *     body: JSON.stringify(data)
             *
             * });
             *
             */


            alert(
                "Please wait while the system updates."
            );

        });

</script>

</body>
</html>
